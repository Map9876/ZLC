name: Build Release APK

# 本 fork 的 CI：每次 push 到 main 自动构建 APK（可在 Actions 产物下载），
# 推送 v* 标签（如 v3.4.7）时自动发布到 GitHub Release。
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (normal + go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # 自动安装 cmdline-tools 并接受许可，再补齐本项目需要的 platform / build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools"

      - name: Generate signing keystore
        # 仓库不含签名材料（signing.properties 被 .gitignore 忽略），CI 临时生成一把密钥，
        # 让 release 变体可被正常签名、可安装。
        run: |
          cd ZLivePhoto.Android
          keytool -genkeypair -v -keystore release.keystore -alias zlc \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=ZLC Fork, O=ZLC, C=CN"
          printf 'storeFile=release.keystore\nstorePassword=android\nkeyAlias=zlc\nkeyPassword=android\n' > signing.properties

      - name: Build release APKs
        run: |
          cd ZLivePhoto.Android
          chmod +x gradlew
          ./gradlew :app:assembleNormalRelease :app:assembleGoRelease --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            ZLivePhoto.Android/app/build/outputs/apk/normal/release/*.apk
            ZLivePhoto.Android/app/build/outputs/apk/go/release/*.apk

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ZLivePhoto.Android/app/build/outputs/apk/normal/release/*.apk
            ZLivePhoto.Android/app/build/outputs/apk/go/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
